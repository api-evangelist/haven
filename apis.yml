name: Haven
description: >-
  Haven, Inc. was an ocean freight technology company founded in 2014 that built
  software to automate quoting, booking, document management, and shipment
  management for commodity producers, traders, and freight forwarders moving
  international ocean cargo. Backed by DCVC, Haven was acquired by supply-chain
  visibility platform FourKites in April 2021, and its technology became the
  foundation of FourKites' Dynamic Ocean product for end-to-end international
  ocean shipment visibility. Haven no longer operates an independent public
  developer program or API; the Haven brand survives only as the "Haven
  Marketplace" login at app.haveninc.com, now operated as part of FourKites.
